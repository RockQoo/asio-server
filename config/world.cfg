# WorldServer 설정

# accept 포트 세 개. 각각 다른 상대가 붙는다.
ports.gateway = 9100
ports.zone = 9200
ports.tool = 9300

io_threads = 2

# 라우팅 레인(owner = clientSessionId). Main/Tool 프로세서가 이 그룹을 공유한다 --
# 둘 다 주인이 같아서, 운영툴이 만지는 대상과 그 사람의 일반 패킷이 같은 스레드로 간다.
basic_threads = 8

# DB 레인. **블로킹을 허용하는 별도 그룹**이라 라우팅과 섞지 않는다 -- 쿼리 한 번이
# 라우팅 레인에 걸리면 그 레인의 모든 사람이 멈춘다. 커넥션은 이 레인마다 하나씩이다.
db_threads = 4
