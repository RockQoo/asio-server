# WorldServer 설정

# accept 포트 세 개. 각각 다른 상대가 붙는다.
ports.gateway = 9100
ports.zone = 9200
ports.tool = 9300

io_threads = 2

# 수신 1차 처리 레인(owner = 링크 세션 id). 링크에서 올라온 프레임의 껍질을 까고 안에 있는
# clientSessionId 를 뽑아 BASIC 으로 넘긴다.
#
# **늘려도 잘 갈라지지 않는다** -- 주인이 링크 세션이라 실질 병렬도가 붙어 있는 게이트웨이/존
# 프로세스 수까지다. 게이트웨이가 1대면 클라이언트 트래픽 전부가 여기 strand 하나를 지난다.
# 이 값은 그 한계를 실측으로 확인하기 위한 손잡이다.
network_threads = 2

# 라우팅 레인(owner = clientSessionId). Main/Login/Tool/Test 프로세서가 이 레인을 공유한다 --
# 주인이 같아서, 운영툴이 만지는 대상과 그 사람의 일반 패킷이 같은 스레드로 간다.
basic_threads = 8

# DB 레인. **블로킹을 허용하는 별도 그룹**이라 라우팅과 섞지 않는다 -- 쿼리 한 번이
# 라우팅 레인에 걸리면 그 레인의 모든 사람이 멈춘다. 커넥션은 이 레인마다 하나씩이다.
db_threads = 4

# 레인 통계 덤프 주기(ms). 0 이면 끈다. 부하 테스트에서 "어디가 밀렸나"를 판정할 유일한 수단이다.
intervals.stats_dump_ms = 10000

# 이 시간을 넘긴 작업은 경고를 남긴다(us). 어느 프로세서가 레인을 태우는지 찾는 용도.
# zone.cfg 와 같은 이름이다 -- 부하를 볼 때 두 파일을 나란히 고치므로 갈리면 안 된다.
slow_task_warn_us = 50000
