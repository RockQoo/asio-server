# ZoneServer 설정
#
# 담당 존 목록은 여기가 아니라 실행 인자로 준다(ZoneServer.exe 1,2) -- 프로세스마다 달라야
# 하는 유일한 값이라, 같은 파일을 여러 프로세스가 공유하려면 인자로 받는 편이 맞다.
#
# 값 하나가 틀리면(정수 자리에 글자 등) 기본값으로 넘어가지 않고 그 자리에서 끝낸다.
# 읽히지 않은 키는 기동 시 경고로 남는다 -- 오타를 조용히 무시하지 않으려는 것이다.

world_host = 127.0.0.1
world_port = 9200

# 소켓 I/O 전용 스레드. 게임 로직을 하지 않고 바이트만 옮긴다.
# 이 프로세스의 소켓은 담당 존마다 하나씩(World 링크)이라 존 수보다 크게 잡을 이유가 없다.
io_threads = 2

# 레인 큐 구현. queue = 잠금 큐, 나머지는 Pipeline::ELaneBackend 참고.
lane_backend = queue

# 레인 크기를 정하는 기준이 레인마다 다르다:
#   lb        -- owner 가 World 링크 세션 id 다. 링크가 존마다 하나뿐이라 **존 수가 상한**.
#                더 줘도 갈리지 않는다. 하는 일은 봉투를 까는 것뿐이라 작게 잡는다
#   basic     -- owner 가 playerId 라 늘린 만큼 실제로 갈린다. 콘텐츠 처리가 전부 여기 있다
#   broadcast -- owner 가 zoneId 라 **존 수가 상한**. 팬아웃이 BASIC 을 붙잡지 않게 떼어둔 것
#
# tick 은 여기 없다 -- 담당 존 수에서 계산된다(존수 x 2 + 1). 주인 값과 레인 수가 1:1로
# 맞아야 하는데 그 관계를 설정으로 끊으면 그 순간 두 존의 틱이 한 스레드로 합쳐진다.
pools.lb_threads = 2
pools.basic_threads = 8
pools.broadcast_threads = 4

# 존 틱 주기(ms). 위치 적분과 경계 판정이 이 주기로 돈다.
intervals.tick_ms = 100

# 팬아웃 함을 비우는 주기(ms). 짧을수록 체감 지연이 줄고, 길수록 소켓에 쓰는 횟수가 준다.
intervals.fanout_flush_ms = 10

# 레인 통계 덤프 주기(ms). 0 이면 끈다. 부하 테스트에서 "어디가 밀렸나"를 판정할 유일한 수단이다.
intervals.stats_dump_ms = 10000
