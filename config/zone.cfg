# ZoneServer 설정
#
# 담당 존 목록은 여기가 아니라 실행 인자로 준다(ZoneServer.exe 1,2) -- 프로세스마다 달라야
# 하는 유일한 값이라, 같은 파일을 여러 프로세스가 공유하려면 인자로 받는 편이 맞다.
#
# 값 하나가 틀리면(정수 자리에 글자 등) 기본값으로 넘어가지 않고 그 자리에서 끝낸다.
# 읽히지 않은 키는 기동 시 경고로 남는다 -- 오타를 조용히 무시하지 않으려는 것이다.

world_host = 127.0.0.1
world_port = 9200

# 소켓 I/O 전용 스레드. 게임 로직을 하지 않고 바이트만 옮긴다.
io_threads = 2

# 레인 크기를 정하는 기준이 그룹마다 다르다:
#   player    -- owner 가 clientSessionId 라 실질 병렬도가 접속자 수만큼이다. 늘린 만큼 갈린다.
#                **수신 파싱도 이 레인이 한다** -- 예전의 LB 레인은 없앴다(주인이 같아 홉만 늘었다)
#   zone      -- 0 이면 담당 존 수에 맞춘다. 존 하나는 스레드 하나가 상한이라 더 줘도 안 빨라진다
#   broadcast -- World 링크가 하나라 어차피 그 소켓에서 직렬화된다
pools.player_threads = 8
pools.zone_threads = 0
pools.broadcast_threads = 1

# 존 틱 주기(ms). 위치 적분과 경계 판정이 이 주기로 돈다.
intervals.tick_ms = 100

# 만료 우편 스윕 주기(ms). 존 레인이 아니라 별도 타이머라, 우편함이 Mutexed 인 이유가 이것이다.
intervals.mail_sweep_ms = 1000

# 레인 통계 덤프 주기(ms). 0 이면 끈다. 부하 테스트에서 "어디가 밀렸나"를 판정할 유일한 수단이다.
intervals.stats_dump_ms = 10000

# 이 시간을 넘긴 작업은 경고를 남긴다(us). 어느 프로세서가 레인을 태우는지 찾는 용도.
slow_task_warn_us = 50000
