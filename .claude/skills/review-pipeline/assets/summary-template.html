<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#5e6b7a;--line:#d9e0e8;--accent:#2457d6} @media(prefers-color-scheme:dark){:root{--bg:#11151b;--card:#1a2029;--text:#edf2f7;--muted:#aab5c3;--line:#344050;--accent:#82aaff}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif} main{max-width:1100px;margin:auto;padding:32px 20px 64px} h1,h2{line-height:1.25} a{color:var(--accent)} .meta,.counts,.finding{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.counts{display:flex;gap:18px;flex-wrap:wrap}.label{color:var(--muted);font-size:13px}.value{font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.finding dl{margin:0}.finding dt{font-weight:700;margin-top:10px}.finding dd{margin:2px 0 0;white-space:pre-wrap}.critical{border-left:5px solid #b42318}.high{border-left:5px solid #e35b1c}.medium{border-left:5px solid #d99b16}.low{border-left:5px solid #4186d6}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>{{BODY}}</main></body>
</html>
